<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your space · Tabs Anonymous</title><link rel="stylesheet" href="style.css"></head><body><div class="popup"><div class="brand">◒ tabs anonymous</div><div class="eyebrow">One tab at a time.</div><h1 id="count">Your space</h1><p id="connection"></p><button id="ephemeral">＋ Open a temporary tab</button><p class="muted" id="shortcut"></p><label for="minutes">Close this tab after (minutes)</label><input id="minutes" type="number" min="1" max="1440" value="15"><div class="actions"><button class="secondary" id="timer">Set lifetime on current tab</button><button class="secondary" id="cancel">Remove lifetime</button><button class="secondary" id="settings">Settings & sponsor</button></div><p id="status" role="status" class="notice"></p></div><script type="module" src="popup.js"></script></body></html>
